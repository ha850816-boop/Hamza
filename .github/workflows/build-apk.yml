
name: Build Hamza APK

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Extract project
        run: |
          unzip MakhzaniSimple_Source.zip -d extracted
          PROJECT=$(find extracted -name settings.gradle -printf '%h\n' | head -1)
          echo "PROJECT=$PROJECT" >> $GITHUB_ENV

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Fix Gradle settings
        run: |
          printf "rootProject.name = 'MakhzaniSimple'\ninclude ':app'\n" > "$PROJECT/settings.gradle"

      - name: Build APK
        run: cd "$PROJECT" && gradle assembleDebug

      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: Hamza-APK
          path: extracted/**/app/build/outputs/apk/debug/app-debug.apk
